<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Party</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1630;--surface:#261f42;--line:#3a3160;--text:#f1ecff;--muted:#a89fcc;--lamp:#f5b94a;--lamp-ink:#2a1c00;--danger:#e0566b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.hidden{display:none!important}

/* Lobby */
#lobby{min-height:100%;display:grid;place-items:center;padding:24px}
.lobby-card{width:100%;max-width:420px}
.lobby-card h1{font-size:clamp(2.6rem,12vw,4rem);line-height:.95;font-weight:800;margin:0 0 12px;letter-spacing:-.03em}
.lobby-card p{color:var(--muted);margin:0 0 28px;line-height:1.5}
label{display:block;font-size:.9rem;color:var(--muted);margin:16px 0 6px}
input[type=text]{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:1rem}
.primary{width:100%;margin-top:24px;padding:15px;border:0;border-radius:10px;background:var(--lamp);color:var(--lamp-ink);font-weight:800;font-size:1.05rem}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px;padding:6px 0}
#err{color:var(--danger);margin-top:14px;min-height:1.2em}

/* Room */
#room{display:flex;flex-direction:column;height:100%;max-width:960px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
header .code{font-weight:800;letter-spacing:.02em}
header .status{color:var(--muted);font-size:.85rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font-size:.9rem}
.stage{background:#000;aspect-ratio:16/9;width:100%;position:relative}
.stage #player,.stage iframe{position:absolute;inset:0;width:100%;height:100%}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;pointer-events:none}
.loadrow{display:flex;gap:8px;padding:10px 14px}
.loadrow input{flex:1;min-width:0}
.loadrow button{border:0;border-radius:10px;background:var(--lamp);color:var(--lamp-ink);font-weight:800;padding:0 18px}
.tiles{flex:1;display:flex;gap:10px;padding:6px 14px 10px;overflow-x:auto;align-content:flex-start;min-height:0}
.tile{position:relative;flex:0 0 auto;width:min(46vw,220px);aspect-ratio:4/3;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile video{width:100%;height:100%;object-fit:cover;background:var(--surface)}
.tile.me video{transform:scaleX(-1)}
.tile span{position:absolute;left:8px;bottom:6px;font-size:.78rem;background:rgba(27,22,48,.8);padding:2px 8px;border-radius:999px}
.bar{display:flex;justify-content:center;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.bar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:12px 20px;font-weight:600}
.bar button.off{background:var(--danger);border-color:var(--danger)}
.bar .leave{background:transparent;color:var(--danger);border-color:var(--danger)}
.tip{color:var(--muted);font-size:.8rem;padding:0 14px 8px}
@media (min-width:800px){#room{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>

<section id="lobby">
  <div class="lobby-card">
    <h1>Watch together, from anywhere.</h1>
    <p>Paste a YouTube link, share your camera and mic, and the video plays in sync for everyone. Pause, play or skip, and it happens on every screen.</p>
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="20" placeholder="e.g. Aman" autocomplete="nickname">
    <label for="roomInput">Room code</label>
    <input id="roomInput" type="text" maxlength="40" placeholder="Pick any word, share it with your friend" autocapitalize="none" autocomplete="off">
    <button class="primary" id="joinBtn">Join room</button>
    <button class="link-btn" id="randomBtn">Make a random room code</button>
    <div id="err" role="alert"></div>
  </div>
</section>

<section id="room" class="hidden">
  <header>
    <span class="code" id="roomLabel"></span>
    <span class="status" id="status">Connecting…</span>
    <button class="chip" id="inviteBtn">Copy invite</button>
  </header>
  <div class="stage">
    <div id="player"></div>
    <div class="empty" id="emptyMsg">Paste a YouTube link below to start.</div>
  </div>
  <form class="loadrow" id="loadForm">
    <input id="ytUrl" type="text" placeholder="Paste YouTube link" inputmode="url" autocomplete="off">
    <button type="submit">Play for all</button>
  </form>
  <div class="tip">Use earphones so your friend doesn’t hear the video through your mic.</div>
  <div class="tiles" id="tiles"></div>
  <div class="bar">
    <button id="micBtn">Mic on</button>
    <button id="camBtn">Camera on</button>
    <button id="leaveBtn" class="leave">Leave</button>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let socket, iceServers = [], localStream = null, myName = 'Guest', roomCode = '';
const peers = {};          // id -> RTCPeerConnection
const pendingIce = {};     // id -> candidates received before remote description
let yt = null, ytReady = false, pendingState = null, currentVideoId = null;
let suppress = false, suppressTimer = null;
let expected = { time: 0, at: 0, playing: false };

/* ---------- Lobby ---------- */
const params = new URLSearchParams(location.search);
$('roomInput').value = (params.get('room') || '').toLowerCase();
$('name').value = localStorage.getItem('wp-name') || '';
$('randomBtn').onclick = () => {
  const w = ['movie','popcorn','sofa','night','cinema','blanket','snacks','couch'];
  $('roomInput').value = w[Math.floor(Math.random()*w.length)] + '-' + Math.floor(100 + Math.random()*900);
};
$('joinBtn').onclick = join;

async function join() {
  const name = $('name').value.trim() || 'Guest';
  const room = $('roomInput').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-');
  if (!room) { $('err').textContent = 'Enter a room code, or make a random one.'; return; }
  $('err').textContent = '';
  myName = name; roomCode = room;
  try { localStorage.setItem('wp-name', name); } catch (e) {}

  try { iceServers = await (await fetch('/ice')).json(); } catch (e) { iceServers = [{ urls: 'stun:stun.l.google.com:19302' }]; }

  // Camera + mic. Low resolution so it works on weak networks.
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 15, max: 20 }, facingMode: 'user' },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e2) { localStream = null; }
  }

  $('lobby').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('roomLabel').textContent = room;
  addTile('me', myName + ' (you)', localStream, true);
  if (!localStream) setStatus('No camera or mic access. You can still watch.');
  if (localStream && !localStream.getVideoTracks().length) $('camBtn').classList.add('off');
  if (!localStream) { $('micBtn').classList.add('off'); $('camBtn').classList.add('off'); }

  connectSocket();
  if (window.YT && YT.Player) initPlayer();
}

/* ---------- Socket + signalling ---------- */
function connectSocket() {
  socket = io();
  socket.on('connect', () => socket.emit('join', { room: roomCode, name: myName }));
  socket.on('full', () => { alert('This room is full (4 people max).'); location.reload(); });

  socket.on('joined', ({ peers: list, state }) => {
    setStatus(list.length ? 'Connected to ' + list.map(p => p.name).join(', ') : 'Waiting for friends. Share the invite.');
    list.forEach(p => createPeer(p.id, p.name, true)); // newcomer calls everyone already here
    if (state) applyState(state);
  });
  socket.on('peer-joined', ({ id, name }) => { createPeer(id, name, false); setStatus(name + ' joined'); });
  socket.on('peer-left', ({ id }) => { removePeer(id); setStatus('A friend left'); });

  socket.on('signal', async ({ from, data }) => {
    const pc = peers[from] || createPeer(from, 'Friend', false);
    try {
      if (data.sdp) {
        await pc.setRemoteDescription(data.sdp);
        (pendingIce[from] || []).forEach(c => pc.addIceCandidate(c).catch(() => {}));
        pendingIce[from] = [];
        if (data.sdp.type === 'offer') {
          await pc.setLocalDescription(await pc.createAnswer());
          socket.emit('signal', { to: from, data: { sdp: pc.localDescription } });
        }
      } else if (data.candidate) {
        if (pc.remoteDescription) await pc.addIceCandidate(data.candidate).catch(() => {});
        else (pendingIce[from] = pendingIce[from] || []).push(data.candidate);
      }
    } catch (e) { console.error('signal error', e); }
  });

  socket.on('video', applyState);
}

function createPeer(id, name, initiator) {
  if (peers[id]) return peers[id];
  const pc = new RTCPeerConnection({ iceServers });
  peers[id] = pc;
  pc.peerName = name;
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  else { pc.addTransceiver('audio', { direction: 'recvonly' }); pc.addTransceiver('video', { direction: 'recvonly' }); }
  pc.onicecandidate = (e) => { if (e.candidate) socket.emit('signal', { to: id, data: { candidate: e.candidate } }); };
  pc.ontrack = (e) => addTile(id, name, e.streams[0], false);
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') setStatus('Connection to ' + name + ' failed. A TURN server may be needed.'); };
  if (initiator) {
    pc.onnegotiationneeded = async () => {
      try {
        await pc.setLocalDescription(await pc.createOffer());
        socket.emit('signal', { to: id, data: { sdp: pc.localDescription } });
      } catch (e) { console.error(e); }
    };
  }
  return pc;
}

function removePeer(id) {
  if (peers[id]) { peers[id].close(); delete peers[id]; }
  const t = $('tile-' + id); if (t) t.remove();
}

function addTile(id, label, stream, isMe) {
  let tile = $('tile-' + id);
  if (!tile) {
    tile = document.createElement('div');
    tile.id = 'tile-' + id;
    tile.className = 'tile' + (isMe ? ' me' : '');
    tile.innerHTML = '<video autoplay playsinline></video><span></span>';
    tile.querySelector('span').textContent = label;
    $('tiles').appendChild(tile);
  }
  const v = tile.querySelector('video');
  v.muted = isMe;
  if (stream && v.srcObject !== stream) v.srcObject = stream;
  v.play && v.play().catch(() => {});
}

function setStatus(t) { $('status').textContent = t; }

/* ---------- Controls ---------- */
$('micBtn').onclick = () => toggle('audio', 'micBtn', 'Mic');
$('camBtn').onclick = () => toggle('video', 'camBtn', 'Camera');
function toggle(kind, btnId, label) {
  if (!localStream) return;
  const tracks = kind === 'audio' ? localStream.getAudioTracks() : localStream.getVideoTracks();
  if (!tracks.length) return;
  const on = !tracks[0].enabled;
  tracks.forEach(t => t.enabled = on);
  $(btnId).textContent = label + (on ? ' on' : ' off');
  $(btnId).classList.toggle('off', !on);
}
$('leaveBtn').onclick = () => { if (localStream) localStream.getTracks().forEach(t => t.stop()); location.href = location.pathname; };
$('inviteBtn').onclick = async () => {
  const url = location.origin + location.pathname + '?room=' + encodeURIComponent(roomCode);
  try { await navigator.clipboard.writeText(url); $('inviteBtn').textContent = 'Copied'; }
  catch (e) { prompt('Copy this invite link:', url); }
  setTimeout(() => $('inviteBtn').textContent = 'Copy invite', 1800);
};

/* ---------- YouTube sync ---------- */
function parseId(input) {
  const m = input.trim().match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(input.trim()) ? input.trim() : null;
}

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => { if (!$('room').classList.contains('hidden')) initPlayer(); };

function initPlayer() {
  if (yt) return;
  yt = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ytReady = true; if (pendingState) { const s = pendingState; pendingState = null; applyState(s); } },
      onStateChange: onYtState
    }
  });
}

$('loadForm').onsubmit = (e) => {
  e.preventDefault();
  const id = parseId($('ytUrl').value);
  if (!id) { setStatus('That doesn’t look like a YouTube link.'); return; }
  $('ytUrl').value = '';
  const st = { videoId: id, playing: true, time: 0 };
  applyState(st);
  socket.emit('video', st);
};

function lock(ms) {
  suppress = true;
  clearTimeout(suppressTimer);
  suppressTimer = setTimeout(() => { suppress = false; }, ms);
}

// Apply a state that came from someone else (or from the server on join)
function applyState(st) {
  if (!st || !st.videoId) return;
  if (!ytReady) { pendingState = st; return; }
  $('emptyMsg').classList.add('hidden');
  lock(2000);
  expected = { time: st.time, at: Date.now(), playing: st.playing };
  if (currentVideoId !== st.videoId) {
    currentVideoId = st.videoId;
    yt.loadVideoById({ videoId: st.videoId, startSeconds: st.time });
    if (!st.playing) setTimeout(() => yt.pauseVideo(), 800);
    return;
  }
  if (Math.abs(yt.getCurrentTime() - st.time) > 1.5) yt.seekTo(st.time, true);
  if (st.playing) yt.playVideo(); else yt.pauseVideo();
}

// Local user pressed play/pause in the player
function onYtState(e) {
  if (suppress) return;
  if (e.data !== YT.PlayerState.PLAYING && e.data !== YT.PlayerState.PAUSED) return;
  sendState(e.data === YT.PlayerState.PLAYING);
}
function sendState(playing) {
  const time = yt.getCurrentTime();
  expected = { time, at: Date.now(), playing };
  socket.emit('video', { videoId: currentVideoId, playing, time });
}

// Detect seeking (scrubbing the bar) by watching for jumps in time
setInterval(() => {
  if (!ytReady || !currentVideoId || suppress) return;
  const s = yt.getPlayerState();
  if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.PAUSED) return;
  const exp = expected.playing ? expected.time + (Date.now() - expected.at) / 1000 : expected.time;
  if (Math.abs(yt.getCurrentTime() - exp) > 2.5) sendState(s === YT.PlayerState.PLAYING);
}, 1000);
</script>
</body>
</html>
